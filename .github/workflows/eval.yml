# ═══════════════════════════════════════════════════════════════════════════════
# eval.yml — AI Eval Quality Gate
# ═══════════════════════════════════════════════════════════════════════════════

name: AI Eval Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repository ────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # ── 4. Smoke tests ─────────────────────────────────────────────────────
      - name: Smoke tests (import + health + UI)
        run: python -m pytest tests/integration/test_api_smoke.py -v
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          VECTOR_DB_PATH: /tmp/ci-chroma

      # ── 5. Eval quality gate ───────────────────────────────────────────────
      - name: Eval quality gate (pass rate ≥ 70%)
        if: ${{ secrets.GROQ_API_KEY != '' }}
        run: python tests/eval/run_eval_ci.py
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          VECTOR_DB_PATH: /tmp/ci-chroma
