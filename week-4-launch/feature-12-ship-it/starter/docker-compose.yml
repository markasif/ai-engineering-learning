

services:
  app:
    build:
      context: ../..
      dockerfile: week-4-launch/feature-12-ship-it/starter/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ../../.env

    environment:
      - VECTOR_DB_PATH=/data/chroma

    volumes:
      - chroma_data:/data/chroma
      - uploads_data:/data/uploads

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

# Named volumes — Docker manages these on the host machine.
# To wipe all data: docker compose down -v
volumes:
  chroma_data:
  uploads_data:
